# Placeholders are filled by `just bench` and experiments/cmd/overhead.
# __INJECT__ is "true" when the target is meshed: STRICT mTLS needs a client
# sidecar, and an unmeshed target must not pay for one.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: bench
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        sidecar.istio.io/inject: "__INJECT__"
      annotations:
        # Let the k6 pod exit even though a sidecar is running.
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args: [run, /scripts/health.js]
          env:
            - name: LABEL
              value: __LABEL__
            - name: DURATION
              value: __DURATION__
            - name: RATE
              value: "__RATE__"
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          projected:
            sources:
              - configMap:
                  name: k6-script
              - configMap:
                  name: bench-targets
