# Istio RED panels for the selected workload namespaces.
{
 "apiVersion": "v1",
 "kind": "ConfigMap",
 "metadata": {
  "name": "platform-unified-dashboard",
  "namespace": "observability",
  "labels": {
   "grafana_dashboard": "1"
  }
 },
 "data": {
  "platform-unified.json": "{\n \"uid\": \"platform-unified\",\n \"title\": \"Platform - unified observability and security\",\n \"schemaVersion\": 39,\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"refresh\": \"30s\",\n \"tags\": [\n  \"platform\",\n  \"correlator\"\n ],\n \"annotations\": {\n  \"list\": [\n   {\n    \"name\": \"Argo CD syncs\",\n    \"enable\": true,\n    \"iconColor\": \"blue\",\n    \"datasource\": {\n     \"type\": \"datasource\",\n     \"uid\": \"grafana\"\n    },\n    \"target\": {\n     \"type\": \"tags\",\n     \"tags\": [\n      \"deploy\"\n     ],\n     \"matchAny\": false,\n     \"limit\": 500\n    }\n   },\n   {\n    \"name\": \"Falco alerts\",\n    \"enable\": true,\n    \"iconColor\": \"red\",\n    \"datasource\": {\n     \"type\": \"datasource\",\n     \"uid\": \"grafana\"\n    },\n    \"target\": {\n     \"type\": \"tags\",\n     \"tags\": [\n      \"falco\"\n     ],\n     \"matchAny\": false,\n     \"limit\": 500\n    }\n   }\n  ]\n },\n \"panels\": [\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Request rate by service (Istio)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (destination_service_name) (rate(istio_requests_total{destination_service_namespace=~\\\"$namespace\\\",reporter=\\\"destination\\\"}[1m]))\",\n     \"legendFormat\": \"{{destination_service_name}}\"\n    }\n   ]\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"5xx rate by service (Istio)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (destination_service_name) (rate(istio_requests_total{destination_service_namespace=~\\\"$namespace\\\",reporter=\\\"destination\\\",response_code=~\\\"5..\\\"}[1m]))\",\n     \"legendFormat\": \"{{destination_service_name}}\"\n    }\n   ]\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"p95 latency by service (Istio)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"ms\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"histogram_quantile(0.95, sum by (le, destination_service_name) (rate(istio_request_duration_milliseconds_bucket{destination_service_namespace=~\\\"$namespace\\\",reporter=\\\"destination\\\"}[1m])))\",\n     \"legendFormat\": \"{{destination_service_name}}\"\n    }\n   ]\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Correlated security incidents (correlator)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (service, rule) (increase(correlator_incidents_total{namespace=~\\\"$namespace\\\"}[5m]))\",\n     \"legendFormat\": \"{{service}}: {{rule}}\"\n    }\n   ]\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Deploy to alert time (correlator)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(correlator_deploy_to_alert_seconds_bucket[30m])))\",\n     \"legendFormat\": \"p50\"\n    }\n   ]\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Network policy drops (Hubble)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"pps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (reason) (rate(hubble_drop_total[1m]))\",\n     \"legendFormat\": \"{{reason}}\"\n    }\n   ]\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Gatekeeper violations (audit)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 24,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (enforcement_action) (gatekeeper_violations)\",\n     \"legendFormat\": \"{{enforcement_action}}\"\n    }\n   ]\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Workload pod CPU / memory\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 24,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"cores\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\\\"$namespace\\\",container!=\\\"\\\"}[1m]))\",\n     \"legendFormat\": \"{{pod}}\"\n    }\n   ]\n  }\n ],\n \"templating\": {\n  \"list\": [\n   {\n    \"name\": \"namespace\",\n    \"type\": \"query\",\n    \"label\": \"Namespace\",\n    \"datasource\": {\n     \"type\": \"prometheus\",\n     \"uid\": \"prometheus\"\n    },\n    \"query\": {\n     \"query\": \"label_values(istio_requests_total{reporter=\\\"destination\\\"}, destination_service_namespace)\",\n     \"refId\": \"ns\"\n    },\n    \"definition\": \"label_values(istio_requests_total{reporter=\\\"destination\\\"}, destination_service_namespace)\",\n    \"multi\": true,\n    \"includeAll\": true,\n    \"refresh\": 2,\n    \"current\": {\n     \"text\": \"All\",\n     \"value\": \"$__all\"\n    }\n   }\n  ]\n }\n}"
 }
