# kube-prometheus-stack ignores prometheus.io/* annotations; every scrape
# target is declared here.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-stats
  namespace: observability
spec:
  # Istio's documented sidecar scrape: every injected pod, any namespace.
  selector:
    matchExpressions:
      - key: security.istio.io/tlsMode
        operator: Exists
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: observability
spec:
  selector:
    matchLabels:
      app: istiod
  namespaceSelector:
    matchNames: [istio-system]
  endpoints:
    - port: http-monitoring
      interval: 30s
---
# Cilium agent + Hubble flow metrics (installed outside Argo CD, before the
# Prometheus CRDs exist, so its chart cannot create these itself).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium
  namespace: observability
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  namespaceSelector:
    matchNames: [kube-system]
  podMetricsEndpoints:
    - port: prometheus
    - port: hubble-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gatekeeper
  namespace: observability
spec:
  selector:
    matchLabels:
      gatekeeper.sh/system: "yes"
  namespaceSelector:
    matchNames: [gatekeeper-system]
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falcosidekick
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [ui]
  namespaceSelector:
    matchNames: [falco]
  endpoints:
    - port: http
      path: /metrics
