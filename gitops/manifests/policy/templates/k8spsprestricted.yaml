# Subset of the Pod Security "restricted" profile, enforced as policy-as-code
# so violations show up in Gatekeeper audit metrics and the correlator.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsprestricted
spec:
  crd:
    spec:
      names:
        kind: K8sPSPRestricted
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsprestricted

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }

        pod_nonroot { input.review.object.spec.securityContext.runAsNonRoot == true }

        violation[{"msg": msg}] {
          c := containers[_]
          c.securityContext.privileged == true
          msg := sprintf("container %v is privileged", [c.name])
        }
        violation[{"msg": msg}] {
          c := containers[_]
          not c.securityContext.allowPrivilegeEscalation == false
          msg := sprintf("container %v must set allowPrivilegeEscalation=false", [c.name])
        }
        violation[{"msg": msg}] {
          c := containers[_]
          not pod_nonroot
          not c.securityContext.runAsNonRoot == true
          msg := sprintf("container %v must run as non-root", [c.name])
        }
        violation[{"msg": msg}] {
          c := containers[_]
          cap := c.securityContext.capabilities.add[_]
          msg := sprintf("container %v adds capability %v", [c.name, cap])
        }
        violation[{"msg": msg}] {
          v := input.review.object.spec.volumes[_]
          v.hostPath
          msg := sprintf("volume %v uses hostPath", [v.name])
        }
