# Replicate Namespaces into Gatekeeper's inventory so k8sallowedrepos can read
# each workload namespace's allowed-repos annotation.
apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata:
  name: config
  namespace: gatekeeper-system
spec:
  sync:
    syncOnly:
      - group: ""
        version: v1
        kind: Namespace
