apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: correlator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: correlator
  source:
    repoURL: https://github.com/uncool-dudes/cncf-platform.git
    targetRevision: main
    path: gitops/manifests/correlator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
