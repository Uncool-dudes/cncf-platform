alertmanager:
  enabled: false
grafana:
  # Random password created out of band by `just grafana-secret`.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Jaeger
      type: jaeger
      uid: jaeger
      url: http://jaeger.observability.svc:16686
      access: proxy
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 4GB
    # Pick up ServiceMonitors/PodMonitors from every namespace, not only
    # ones labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
    storageSpec: {}
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: true
