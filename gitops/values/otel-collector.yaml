fullnameOverride: otel-collector
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-k8s
presets:
  kubernetesAttributes:
    enabled: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
ports:
  prom-metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: prom-metrics
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    batch: {}
  exporters:
    otlp/jaeger:
      endpoint: jaeger.observability.svc:4317
      tls:
        insecure: true
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion:
        enabled: true
    # No log backend in this stack; keep logs visible in collector output only.
    debug:
      verbosity: basic
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/jaeger]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
